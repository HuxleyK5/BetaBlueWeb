[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-beta-blue"
version = "0.15.0"
description = "An offline-first, open-world monster-catching RPG prototype"
requires-python = ">=3.10"
dependencies = ["pygame>=2.5,<3"]

[project.scripts]
pokemon-beta-blue = "game.main:main"

[tool.setuptools.packages.find]
include = ["game*"]
